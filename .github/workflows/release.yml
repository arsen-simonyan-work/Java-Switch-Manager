name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64-deb
            extension: deb
            suffix: linux-x64
          - os: windows-2025
            artifact: windows-x64-exe
            extension: exe
            suffix: windows-x64
          - os: macos-15
            artifact: macos-arm64-dmg
            extension: dmg
            suffix: macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Verify WiX
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Command candle.exe -ErrorAction Stop
          Get-Command light.exe -ErrorAction Stop

      - name: Read application version
        shell: bash
        run: echo "APP_VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"

      - name: Verify version/tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test "$APP_VERSION" = "$TAG" || { echo "VERSION=$APP_VERSION but tag=$GITHUB_REF_NAME"; exit 1; }

      - name: Test
        shell: bash
        run: ./gradlew test --stacktrace

      - name: Package
        shell: bash
        run: ./gradlew packageDistributionForCurrentOS --stacktrace

      - name: Stage package
        shell: bash
        run: |
          mkdir -p artifacts
          PACKAGE=$(find build/compose/binaries -type f -name "*.${{ matrix.extension }}" | head -n 1)
          test -n "$PACKAGE" || { echo "No .${{ matrix.extension }} package found"; exit 1; }
          cp "$PACKAGE" "artifacts/JavaSwitchManager-${APP_VERSION}-${{ matrix.suffix }}.${{ matrix.extension }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/* \
              --title "Java Switch Manager ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

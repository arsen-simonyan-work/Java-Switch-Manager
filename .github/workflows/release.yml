name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-deb
          - os: windows-latest
            artifact: windows-msi
          - os: macos-15
            artifact: macos-dmg
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Install WiX
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install wixtoolset --no-progress -y

      - name: Verify version/tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          TAG=${GITHUB_REF_NAME}
          test "$VERSION" = "$TAG" || { echo "VERSION=$VERSION but tag=$TAG"; exit 1; }

      - name: Test
        run: gradle test --stacktrace

      - name: Package
        run: gradle packageDistributionForCurrentOS --stacktrace

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/compose/binaries/**
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-artifacts/**/* \
            --title "Java Switch Manager ${GITHUB_REF_NAME}" \
            --generate-notes
